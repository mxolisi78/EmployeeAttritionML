<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Attrition Predictor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9; margin: 0; padding: 40px 20px;
            color: #1f2937;
        }
        .container {
            max-width: 900px; margin: 0 auto; background: #fff;
            padding: 32px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { margin-top: 0; color: #1e3a5f; }
        h2 { color: #1e3a5f; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
        label { display: block; margin-top: 12px; font-weight: 500; font-size: 14px; }
        input, select {
            width: 100%; padding: 8px 10px; margin-top: 4px;
            border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
        }
        button {
            margin-top: 24px; padding: 12px 24px; font-size: 16px;
            background: #1e3a5f; color: #fff; border: 0; border-radius: 6px;
            cursor: pointer; font-weight: 600;
        }
        button:hover { background: #2c5282; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 20px; }
        .result-card {
            padding: 24px; border-radius: 10px; margin-top: 20px;
            font-size: 18px;
        }
        .result-leave { background: #fee2e2; border-left: 6px solid #d7263d; }
        .result-stay  { background: #dcfce7; border-left: 6px solid #4c9f70; }
        .prob { font-size: 32px; font-weight: 700; margin: 8px 0; }
        a.back { display: inline-block; margin-top: 24px; color: #1e3a5f; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
